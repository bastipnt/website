name: Deploy

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: website-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.0.36"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            dist
            .cache
          key: ${{ runner.os }}-build-${{ hashFiles('dist') }}
          restore-keys: |
            ${{ runner.os }}-build-
      - name: Install dependencies
        run: bun install
      - name: Build with Bun
        run: bun run build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bastipnt-website
          path: |
            dist
            Caddyfile
            docker-compose.yaml
          overwrite: true

  deploy:
    environment:
      name: website-deploy
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: Ubuntu-20.04
    needs: build
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: bastipnt-website
      - name: Deploy to Hetzner
      - uses: webfactory/ssh-agent@v0.4.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - run: mkdir -p ~/.ssh/ && ssh-keyscan -H $HETZNER_SERVER >> ~/.ssh/known_hosts
      - run: scp -r * root@$HETZNER_SERVER:/root/bastipnt
      - run: ssh root@$HETZNER_SERVER cd bastipnt
      - run: ssh root@$HETZNER_SERVER docker compose down
      - run: ssh root@$HETZNER_SERVER docker compose up -d
